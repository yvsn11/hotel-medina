[project]
name = "hotel-medina-backend"
version = "1.0.0"
description = "Hotel Medina booking API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"migrations/*" = ["S608", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["flask_migrate.*", "flask_cors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
